version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  command: sh scripts/start.sh
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: AUTH_TRUST_HOST
      value: "true"
    - name: HUBSPOT_PIPELINE_ID
      value: "691581097"
    - name: HUBSPOT_STAGE_NEW_ID
      value: "1012021141"
    - name: TWILIO_FROM_NUMBER_AZ
      value: "+16233236445"
    - name: TWILIO_FROM_NUMBER_FL
      value: "+17867861238"
  secrets:
    - name: DATABASE_URL
      value-from: arn:aws:secretsmanager:us-east-1:035722575731:secret:nuvision-referral/DATABASE_URL-xwlrMa
    - name: AUTH_SECRET
      value-from: arn:aws:secretsmanager:us-east-1:035722575731:secret:nuvision-referral/AUTH_SECRET-ElRlvu
    - name: HUBSPOT_PRIVATE_APP_TOKEN
      value-from: arn:aws:secretsmanager:us-east-1:035722575731:secret:nuvision-referral/HUBSPOT_PRIVATE_APP_TOKEN-XBo9Kw
    - name: HUBSPOT_CLIENT_SECRET
      value-from: arn:aws:secretsmanager:us-east-1:035722575731:secret:nuvision-referral/HUBSPOT_CLIENT_SECRET-whGvtf
    - name: TWILIO_ACCOUNT_SID
      value-from: arn:aws:secretsmanager:us-east-1:035722575731:secret:nuvision-referral/TWILIO_ACCOUNT_SID-EbTkz2
    - name: TWILIO_AUTH_TOKEN
      value-from: arn:aws:secretsmanager:us-east-1:035722575731:secret:nuvision-referral/TWILIO_AUTH_TOKEN-9UByE4
    - name: GMAIL_AUTH_EMAIL
      value-from: arn:aws:secretsmanager:us-east-1:035722575731:secret:nuvision-referral/GMAIL_AUTH_EMAIL-AQgnUR
    - name: GMAIL_APP_PASSWORD
      value-from: arn:aws:secretsmanager:us-east-1:035722575731:secret:nuvision-referral/GMAIL_APP_PASSWORD-9FxCv0
